apiVersion: batch/v1
kind: Job
metadata:
  name: minio-migrate-legacy
  namespace: cuenly-backend
  labels:
    app: minio-migrate-legacy
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: minio-migrate-legacy
    spec:
      restartPolicy: Never
      containers:
        - name: minio-migrate-legacy
          image: minio/mc:latest
          envFrom:
            - secretRef:
                name: minio-legacy-credentials
            - secretRef:
                name: minio-credentials
          env:
            - name: MINIO_BUCKET
              value: "bk-invoice"
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              if [ -z "${OLD_MINIO_ENDPOINT:-}" ]; then
                echo "sin endpoint legacy, skip"
                exit 0
              fi

              OLD_MINIO_ENDPOINT="${OLD_MINIO_ENDPOINT#https://}"
              OLD_MINIO_ENDPOINT="${OLD_MINIO_ENDPOINT#http://}"

              mc alias set old "https://${OLD_MINIO_ENDPOINT}" "${OLD_MINIO_ACCESS_KEY}" "${OLD_MINIO_SECRET_KEY}"
              mc alias set new "http://minio-service:9000" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"

              mc mb --ignore-existing "new/${MINIO_BUCKET}"
              mc mirror --overwrite "old/${MINIO_BUCKET}" "new/${MINIO_BUCKET}"

              echo "migración de datos legacy completada"
