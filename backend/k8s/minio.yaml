apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: cuenly-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: cuenly-backend
  labels:
    app: minio
    tier: storage
spec:
  replicas: 1
  strategy:
    type: Recreate   # Para que nunca haya dos pods con el mismo PVC
  selector:
    matchLabels:
      app: minio
      tier: storage
  template:
    metadata:
      labels:
        app: minio
        tier: storage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: minio
        image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
        args:
          - server
          - /data
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_ROOT_PASSWORD
        ports:
        - containerPort: 9000
          name: s3
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: cuenly-backend
  labels:
    app: minio
    tier: storage
spec:
  type: ClusterIP   # Solo accesible dentro del cluster, sin consola ni Ingress
  selector:
    app: minio
    tier: storage
  ports:
  - port: 9000
    targetPort: 9000
    name: s3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-network-policy
  namespace: cuenly-backend
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: cuenly-backend
          podSelector:
            matchLabels:
              app: cuenly-backend
        - namespaceSelector:
            matchLabels:
              name: cuenly-backend
          podSelector:
            matchLabels:
              app: cuenly-worker
      ports:
        - protocol: TCP
          port: 9000
