# .github/workflows/cuenly-deploy.yml
name: Unified CI/CD - Backend & Frontend

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'config/**'
      - 'nginx/**'
      # Se deja este propio workflow en paths a propósito: un cambio CI-only
      # SÍ dispara un build+deploy real (config-changed fuerza backend/frontend
      # a true), así que sirve para validar que el pipeline sigue funcionando
      # después de tocarlo — con el fix de más abajo (build-backend == 'success'
      # a secas) ya no puede fallar por "build skipped, imagen inexistente".
      - '.github/workflows/cuenly-deploy.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'config/**'
      - 'nginx/**'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Force deploy backend'
        type: boolean
        default: false
      deploy_frontend:
        description: 'Force deploy frontend'
        type: boolean
        default: false
      environment:
        description: 'Target environment'
        type: choice
        options:
          - development
          - staging
          - production
        default: development

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: "1"

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      config-changed: ${{ steps.changes.outputs.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "backend=${{ github.event.inputs.deploy_backend || 'true' }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ github.event.inputs.deploy_frontend || 'true' }}" >> $GITHUB_OUTPUT
            echo "config=true" >> $GITHUB_OUTPUT
          else
            # Detectar cambios desde el último commit
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            else
              BASE_SHA="${{ github.event.before }}"
            fi
            
            # Si es el primer push o no hay commit anterior, comparar con HEAD~1
            if [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ] || [ -z "$BASE_SHA" ]; then
              BASE_SHA="HEAD~1"
            fi
            
            # Obtener lista de archivos cambiados
            CHANGED_FILES=$(git diff --name-only $BASE_SHA HEAD)
            echo "📁 Archivos cambiados:"
            echo "$CHANGED_FILES"
            
            # Detectar cambios en backend (código o k8s)
            BACKEND_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^backend/' > /dev/null && echo "true" || echo "false")

            # Detectar cambios en frontend (código o k8s)
            FRONTEND_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^frontend/' > /dev/null && echo "true" || echo "false")

            # Detectar cambios de configuración global
            CONFIG_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(config/|nginx/|docker-compose\.yml|\.github/workflows/)' > /dev/null && echo "true" || echo "false")

            # Si hay cambios en config global, forzar redeploy de backend y frontend
            if [ "$CONFIG_CHANGED" == "true" ]; then
              echo "🔧 Cambios globales detectados, marcando backend y frontend"
              BACKEND_CHANGED="true"
              FRONTEND_CHANGED="true"
            fi

            echo "backend=$BACKEND_CHANGED" >> $GITHUB_OUTPUT
            echo "frontend=$FRONTEND_CHANGED" >> $GITHUB_OUTPUT
            echo "config=$CONFIG_CHANGED" >> $GITHUB_OUTPUT
          fi

          echo "🔍 Changes detected:"
          echo "  Backend: $(grep 'backend=' $GITHUB_OUTPUT | cut -d'=' -f2)"
          echo "  Frontend: $(grep 'frontend=' $GITHUB_OUTPUT | cut -d'=' -f2)"
          echo "  Config: $(grep 'config=' $GITHUB_OUTPUT | cut -d'=' -f2)"

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true' || needs.detect-changes.outputs.config-changed == 'true'
    runs-on: self-hosted
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.description=CuenlyApp Backend API
            
      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          platforms: linux/amd64

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true' || needs.detect-changes.outputs.config-changed == 'true'
    runs-on: self-hosted
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:

      - uses: actions/checkout@v4
      
      # ✅ Actualizar environment files con secretos (sin regenerar desde cero)
      - name: Generate environment files with secrets for production
        run: |
          echo "🔧 Generando environment files con secretos..."

          # Configurar FRONTEND_API_KEY — Configurar como secret en GitHub: Settings → Secrets → Actions
          FRONTEND_API_KEY="${{ secrets.FRONTEND_API_KEY }}"
          if [ -z "$FRONTEND_API_KEY" ]; then
            echo "ERROR: Secret FRONTEND_API_KEY no configurado en GitHub Secrets" >&2
            exit 1
          fi
          echo "✅ FRONTEND_API_KEY configurado correctamente"

          # Crear directorio
          mkdir -p frontend/src/environments

          # Crear interfaz TypeScript
          cat > frontend/src/environments/environment.interface.ts << 'EOF'
          export interface Environment {
            production: boolean;
            apiUrl: string;
            frontendApiKey: string;
            firebase: {
              apiKey: string;
              authDomain: string;
              projectId: string;
              storageBucket: string;
              messagingSenderId: string;
              appId: string;
              measurementId: string;
            };
          }
          EOF

          # Configurar Firebase — Configurar como secrets en GitHub: Settings → Secrets → Actions
          FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
          FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
          FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}"
          FIREBASE_MEASUREMENT_ID="${{ secrets.FIREBASE_MEASUREMENT_ID }}"

          # Verificar que todos los secrets de Firebase están configurados
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "ERROR: Secret FIREBASE_API_KEY no configurado en GitHub Secrets" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_AUTH_DOMAIN" ]; then
            echo "ERROR: Secret FIREBASE_AUTH_DOMAIN no configurado en GitHub Secrets" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "ERROR: Secret FIREBASE_PROJECT_ID no configurado en GitHub Secrets" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_STORAGE_BUCKET" ]; then
            echo "ERROR: Secret FIREBASE_STORAGE_BUCKET no configurado en GitHub Secrets" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_MESSAGING_SENDER_ID" ]; then
            echo "ERROR: Secret FIREBASE_MESSAGING_SENDER_ID no configurado en GitHub Secrets" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "ERROR: Secret FIREBASE_APP_ID no configurado en GitHub Secrets" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_MEASUREMENT_ID" ]; then
            echo "ERROR: Secret FIREBASE_MEASUREMENT_ID no configurado en GitHub Secrets" >&2
            exit 1
          fi

          echo "🔧 Creando environment.ts..."
          cat > frontend/src/environments/environment.ts << EOF
          import { Environment } from './environment.interface';
          export const environment: Environment = {
            production: false,
            apiUrl: '',
            frontendApiKey: "${FRONTEND_API_KEY}",
            firebase: {
              apiKey: "${FIREBASE_API_KEY}",
              authDomain: "${FIREBASE_AUTH_DOMAIN}",
              projectId: "${FIREBASE_PROJECT_ID}",
              storageBucket: "${FIREBASE_STORAGE_BUCKET}",
              messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
              appId: "${FIREBASE_APP_ID}",
              measurementId: "${FIREBASE_MEASUREMENT_ID}"
            }
          };
          EOF
          
          echo "🔧 Creando environment.prod.ts..."
          cat > frontend/src/environments/environment.prod.ts << EOF
          import { Environment } from './environment.interface';
          export const environment: Environment = {
            production: true,
            apiUrl: '',
            frontendApiKey: "${FRONTEND_API_KEY}",
            firebase: {
              apiKey: "${FIREBASE_API_KEY}",
              authDomain: "${FIREBASE_AUTH_DOMAIN}",
              projectId: "${FIREBASE_PROJECT_ID}",
              storageBucket: "${FIREBASE_STORAGE_BUCKET}",
              messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
              appId: "${FIREBASE_APP_ID}",
              measurementId: "${FIREBASE_MEASUREMENT_ID}"
            }
          };
          EOF
          
          echo "✅ Archivos environment generados con Firebase Analytics"
          echo "📋 Archivos creados:"
          ls -la frontend/src/environments/
          echo ""
          echo "🔍 Verificando Firebase Analytics configurado:"
          echo "measurementId en environment.ts: $(grep -o 'measurementId: ".*"' frontend/src/environments/environment.ts || echo '❌ NO ENCONTRADO')"
          echo "measurementId en environment.prod.ts: $(grep -o 'measurementId: ".*"' frontend/src/environments/environment.prod.ts || echo '❌ NO ENCONTRADO')"
          echo "projectId en prod: $(grep -o 'projectId: ".*"' frontend/src/environments/environment.prod.ts || echo '❌ NO ENCONTRADO')"
          echo ""
          echo "🔧 Firebase config values used:"
          echo "- API Key: ${FIREBASE_API_KEY:0:10}..."
          echo "- Project ID: $FIREBASE_PROJECT_ID"
          echo "- Measurement ID: $FIREBASE_MEASUREMENT_ID"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.description=CuenlyApp Frontend Application
            
      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          platforms: linux/amd64

  deploy-backend:
    needs: [detect-changes, build-backend]
    # Backend se despliega si cambió backend O config Y el build fue exitoso Y estamos en rama principal.
    # Requiere build-backend == 'success' a secas (no 'skipped'): este job no tiene
    # fallback si la imagen sha-<GITHUB_SHA> no existe (a diferencia de deploy-frontend,
    # que sí cae a :latest) — deployar con build skipped apunta a un tag que nadie
    # buildeó y el docker manifest inspect falla siempre. Nota: dado que build-backend
    # corre con el mismo gate (backend-changed || config-changed) que este job, en la
    # práctica 'skipped' nunca coincide con este 'if' ya true — pero se deja explícito
    # por higiene, no por necesidad estricta hoy.
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (needs.detect-changes.outputs.backend-changed == 'true' || needs.detect-changes.outputs.config-changed == 'true') && needs.build-backend.result == 'success'
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment || 'development' }}
    permissions:
      contents: write
      packages: read
    env:
      NAMESPACE: cuenly-backend
    outputs:
      backend-ready: ${{ steps.health-check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup kubectl context
        run: |
          kubectl config current-context

      # Namespace la crea Argo (CreateNamespace=true en la Application cuenly)

      - name: Create/Update backend secrets
        run: |
          set -euo pipefail

          # Configurar FRONTEND_API_KEY — Configurar como secret en GitHub: Settings → Secrets → Actions
          FRONTEND_API_KEY_VALUE="${{ secrets.FRONTEND_API_KEY }}"
          if [ -z "$FRONTEND_API_KEY_VALUE" ]; then
            echo "ERROR: Secret FRONTEND_API_KEY no configurado en GitHub Secrets" >&2
            exit 1
          fi
          echo "✅ FRONTEND_API_KEY configurado desde secrets"

          # Validar FIREBASE_SERVICE_ACCOUNT_JSON — requerido para Firebase Admin SDK (gestión de admins)
          # Configurar como secret en GitHub: Settings → Secrets → Actions → FIREBASE_SERVICE_ACCOUNT_JSON
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "ERROR: Secret FIREBASE_SERVICE_ACCOUNT_JSON no configurado en GitHub Secrets" >&2
            echo "Crear service account en GCP con rol Cloud Datastore User y agregar el JSON (base64)" >&2
            exit 1
          fi
          echo "✅ FIREBASE_SERVICE_ACCOUNT_JSON configurado"

          kubectl delete secret backend-env-secrets -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret generic backend-env-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=MONGODB_URL="${{ secrets.MONGODB_URL }}" \
            --from-literal=MONGODB_DATABASE="${{ secrets.MONGODB_DATABASE }}" \
            --from-literal=MONGODB_COLLECTION="${{ secrets.MONGODB_COLLECTION }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --from-literal=AI_PROVIDER="${{ secrets.AI_PROVIDER || 'gemini' }}" \
            --from-literal=API_HOST="${{ secrets.API_HOST }}" \
            --from-literal=API_PORT="${{ secrets.API_PORT }}" \
            --from-literal=LOG_LEVEL="${{ secrets.LOG_LEVEL }}" \
            --from-literal=TEMP_PDF_DIR="${{ secrets.TEMP_PDF_DIR }}" \
            --from-literal=JOB_INTERVAL_MINUTES="${{ secrets.JOB_INTERVAL_MINUTES }}" \
            --from-literal=JOB_RESTORE_ON_BOOT="${{ secrets.JOB_RESTORE_ON_BOOT || 'false' }}" \
            --from-literal=JOB_OWNER_TTL_SECONDS="${{ secrets.JOB_OWNER_TTL_SECONDS || '120' }}" \
            --from-literal=AUTH_REQUIRE="${{ secrets.AUTH_REQUIRE }}" \
            --from-literal=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --from-literal=MULTI_TENANT_ENFORCE="${{ secrets.MULTI_TENANT_ENFORCE }}" \
            --from-literal=MINIO_ENDPOINT="minio-service.cuenly-backend.svc.cluster.local:9000" \
            --from-literal=MINIO_ACCESS_KEY="${{ secrets.MINIO_ROOT_USER }}" \
            --from-literal=MINIO_SECRET_KEY="${{ secrets.MINIO_ROOT_PASSWORD }}" \
            --from-literal=MINIO_BUCKET="${{ secrets.MINIO_BUCKET }}" \
            --from-literal=MINIO_SECURE="false" \
            --from-literal=MINIO_REGION="${{ secrets.MINIO_REGION }}" \
            --from-literal=FRONTEND_API_KEY="${FRONTEND_API_KEY_VALUE}" \
            --from-literal=REDIS_HOST="cuenly-redis-service" \
            --from-literal=REDIS_PORT="6379" \
            --from-literal=REDIS_PASSWORD="" \
            --from-literal=REDIS_SSL="false" \
            --from-literal=MAX_CONCURRENT_ACCOUNTS="${{ secrets.MAX_CONCURRENT_ACCOUNTS || '30' }}" \
            --from-literal=PAGOPAR_PUBLIC_KEY="${{ secrets.PAGOPAR_PUBLIC_KEY }}" \
            --from-literal=PAGOPAR_PRIVATE_KEY="${{ secrets.PAGOPAR_PRIVATE_KEY }}" \
            --from-literal=PAGOPAR_BASE_URL="${{ secrets.PAGOPAR_BASE_URL }}" \
            --from-literal=GOOGLE_OAUTH_CLIENT_ID="${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" \
            --from-literal=GOOGLE_OAUTH_CLIENT_SECRET="${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" \
            --from-literal=GOOGLE_OAUTH_REDIRECT_URI="${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}" \
            --from-literal=FIREBASE_SERVICE_ACCOUNT_JSON="${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" \
            --from-literal=BOOTSTRAP_ADMIN_EMAIL="${{ secrets.BOOTSTRAP_ADMIN_EMAIL || '' }}"
            
      - name: Create/Update MongoDB secrets
        run: |
          set -euo pipefail
          kubectl delete secret cuenly-backend-secrets -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret generic cuenly-backend-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=mongodb-root-username="${{ secrets.MONGODB_ROOT_USERNAME }}" \
            --from-literal=mongodb-root-password="${{ secrets.MONGODB_ROOT_PASSWORD }}" \
            --from-literal=mongodb-database="${{ secrets.MONGODB_DATABASE }}"
          echo "✅ Secrets de MongoDB creados correctamente"

      - name: Create/Update MinIO credentials secret
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.MINIO_ROOT_USER }}" ] || [ -z "${{ secrets.MINIO_ROOT_PASSWORD }}" ]; then
            echo "ERROR: Secrets MINIO_ROOT_USER / MINIO_ROOT_PASSWORD no configurados en GitHub Secrets" >&2
            exit 1
          fi

          kubectl delete secret minio-credentials -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret generic minio-credentials \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=MINIO_ROOT_USER="${{ secrets.MINIO_ROOT_USER }}" \
            --from-literal=MINIO_ROOT_PASSWORD="${{ secrets.MINIO_ROOT_PASSWORD }}"
          echo "✅ Secret minio-credentials creado correctamente"

      - name: Create/Update AlertManager secrets
        if: ${{ false }}
        run: |
          set -euo pipefail
          
          echo "🔐 Creando secrets de AlertManager desde GitHub Secrets..."
          
          # Verificar que todos los secrets requeridos estén configurados
          if [ -z "${{ secrets.ALERTMANAGER_SMTP_HOST }}" ]; then
            echo "❌ ERROR: ALERTMANAGER_SMTP_HOST no configurado en GitHub Secrets"
            exit 1
          fi
          
          if [ -z "${{ secrets.ALERTMANAGER_SMTP_PORT }}" ]; then
            echo "❌ ERROR: ALERTMANAGER_SMTP_PORT no configurado en GitHub Secrets"
            exit 1
          fi
          
          if [ -z "${{ secrets.ALERTMANAGER_SMTP_USER }}" ]; then
            echo "❌ ERROR: ALERTMANAGER_SMTP_USER no configurado en GitHub Secrets"
            exit 1
          fi
          
          if [ -z "${{ secrets.ALERTMANAGER_SMTP_PASSWORD }}" ]; then
            echo "❌ ERROR: ALERTMANAGER_SMTP_PASSWORD no configurado en GitHub Secrets"
            exit 1
          fi
          
          if [ -z "${{ secrets.ALERTMANAGER_EMAIL_TO }}" ]; then
            echo "❌ ERROR: ALERTMANAGER_EMAIL_TO no configurado en GitHub Secrets"
            exit 1
          fi
          
          # Crear secret de Kubernetes usando los GitHub Secrets directamente
          kubectl delete secret alertmanager-secrets -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret generic alertmanager-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=ALERTMANAGER_SMTP_HOST="${{ secrets.ALERTMANAGER_SMTP_HOST }}" \
            --from-literal=ALERTMANAGER_SMTP_PORT="${{ secrets.ALERTMANAGER_SMTP_PORT }}" \
            --from-literal=ALERTMANAGER_SMTP_USER="${{ secrets.ALERTMANAGER_SMTP_USER }}" \
            --from-literal=ALERTMANAGER_SMTP_PASSWORD="${{ secrets.ALERTMANAGER_SMTP_PASSWORD }}" \
            --from-literal=ALERTMANAGER_EMAIL_TO="${{ secrets.ALERTMANAGER_EMAIL_TO }}"
          
          echo "✅ Secrets de AlertManager creados correctamente desde GitHub Secrets"
            
      - name: Cleanup old MongoDB resources
        run: |
          # Eliminar recursos problemáticos del replica set
          kubectl delete statefulset mongodb -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl delete service mongodb -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl delete secret mongodb-keyfile -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl delete job mongodb-appuser -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl delete pdb mongodb-pdb -n ${{ env.NAMESPACE }} --ignore-not-found=true
          
          # Esperar a que se limpien los pods
          sleep 10
            
      # MongoDB y MinIO (backend/k8s/mongodb-simple.yaml, backend/k8s/minio.yaml) los
      # aplica Argo (Application cuenly, path backend/k8s). El CI ya no los apply-ea.

      # La migración de datos legacy de MinIO ya se hizo (ver commit d2cf732,
      # que borró backend/k8s/minio-migration-job.yaml). El MinIO legacy
      # (minpoint.mindtechpy.net) fue dado de baja. Se elimina el step
      # "Migrate legacy MinIO data": aplicaba ese manifiesto, que ya no existe
      # en el repo — quedaba vivo solo porque MINIO_LEGACY_ENDPOINT nunca
      # estuvo seteado (early exit), pero de setearse habría fallado.

      - name: Apply NetworkPolicies and Security Configurations
        run: |
          # NetworkPolicies (backend/k8s/networkpolicy-*.yaml) las aplica Argo.

          # Rate limiting y configuraciones de seguridad (fuera de backend/k8s, Argo no los cubre)
          echo "🛡️  Aplicando configuraciones de rate limiting y seguridad..."
          kubectl apply -f k8s-security-improvements/rate-limiting-configmap.yaml -n ${{ env.NAMESPACE }} || echo "⚠️  Rate limiting config no encontrado, continuando..."
          
          echo "✅ Configuraciones de seguridad aplicadas"
          
      - name: Create/Update AlertManager ConfigMap
        if: ${{ false }}
        run: |
          set -euo pipefail
          echo "🔧 Creando ConfigMap de AlertManager desde archivo de configuración..."
          
          # Verificar que el archivo de configuración existe
          if [ ! -f "config/alertmanager.yml" ]; then
            echo "❌ Error: config/alertmanager.yml no encontrado"
            exit 1
          fi
          
          # Crear ConfigMap desde el archivo que ya usa variables de entorno
          kubectl delete configmap alertmanager-config -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create configmap alertmanager-config \
            --from-file=config.yml=config/alertmanager.yml \
            --namespace=${{ env.NAMESPACE }}
          
          echo "✅ ConfigMap de AlertManager creado con configuración segura"
          
      - name: Initialize MongoDB with script
        run: |
          set -euo pipefail
          echo "🔧 Inicializando MongoDB con datos base..."
          # Esperar que MongoDB esté completamente listo
          sleep 15
          
          # Verificar conectividad a MongoDB
          kubectl exec deployment/mongodb -n ${{ env.NAMESPACE }} -- mongosh --eval 'db.adminCommand({ ping: 1 })'
          
          # Aplicar script de inicialización si existe usando autenticación admin
          if [ -f "config/mongo-init.js" ]; then
            kubectl cp config/mongo-init.js ${{ env.NAMESPACE }}/$(kubectl get pod -l app=mongodb -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].metadata.name}'):/tmp/mongo-init.js
            
            # Ejecutar con autenticación admin
            ROOT_USER=$(kubectl get secret cuenly-backend-secrets -n ${{ env.NAMESPACE }} -o jsonpath='{.data.mongodb-root-username}' | base64 -d)
            ROOT_PASS=$(kubectl get secret cuenly-backend-secrets -n ${{ env.NAMESPACE }} -o jsonpath='{.data.mongodb-root-password}' | base64 -d)
            
            kubectl exec deployment/mongodb -n ${{ env.NAMESPACE }} -- mongosh -u "$ROOT_USER" -p "$ROOT_PASS" --authenticationDatabase admin cuenlyapp_warehouse /tmp/mongo-init.js
            echo "✅ Script de inicialización aplicado"
          else
            echo "ℹ️  No se encontró config/mongo-init.js"
          fi
          
          # Aplicar índices de rendimiento
          if [ -f "config/mongo-indexes.js" ]; then
            echo "🚀 Aplicando índices de rendimiento..."
            kubectl cp config/mongo-indexes.js ${{ env.NAMESPACE }}/$(kubectl get pod -l app=mongodb -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].metadata.name}'):/tmp/mongo-indexes.js
            kubectl exec deployment/mongodb -n ${{ env.NAMESPACE }} -- mongosh -u "$ROOT_USER" -p "$ROOT_PASS" --authenticationDatabase admin /tmp/mongo-indexes.js || true
            echo "✅ Índices de rendimiento aplicados"
          else
            echo "⚠️  No se encontró script mongo-indexes.js, continuando..."
          fi
          
      - name: Deploy backend application
        run: |
          set -euo pipefail
          echo "🚀 Desplegando backend..."
          
          # Obtener SHA corto para tag único
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          EXPECTED_BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-backend:sha-${SHORT_SHA}
          echo "📦 Preparando imagen: ${EXPECTED_BACKEND_IMAGE}"
          
          # Verificar que la imagen backend existe antes de desplegar.
          # Retry: GHCR a veces tarda en propagar el manifest recién pusheado
          # (visto varias veces: el push termina ok pero el inspect inmediato
          # devuelve "not found" por unos minutos).
          IMAGE_FOUND=false
          for attempt in $(seq 1 5); do
            if docker manifest inspect "${EXPECTED_BACKEND_IMAGE}" > /dev/null 2>&1; then
              IMAGE_FOUND=true
              break
            fi
            echo "⏳ Intento $attempt/5: imagen no encontrada todavía en GHCR, reintentando en 15s..."
            sleep 15
          done
          if [ "$IMAGE_FOUND" != "true" ]; then
            echo "❌ Error: imagen backend no encontrada en GHCR tras 5 intentos: ${EXPECTED_BACKEND_IMAGE}"
            exit 1
          fi
          
          # Verificar si existe deployment con selector diferente y eliminarlo
          echo "🔍 Verificando deployment existente..."
          if kubectl get deployment cuenly-backend -n ${{ env.NAMESPACE }} &>/dev/null; then
            echo "⚠️  Deployment existente encontrado, verificando selector..."
            
            # Obtener selector actual
            CURRENT_SELECTOR=$(kubectl get deployment cuenly-backend -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.selector.matchLabels}' 2>/dev/null || echo '{}')
            echo "Selector actual: $CURRENT_SELECTOR"
            
            # Si el selector no incluye 'tier: backend', eliminar el deployment
            if ! echo "$CURRENT_SELECTOR" | grep -q '"tier":"backend"'; then
              echo "⚠️  Selector incompatible detectado, eliminando deployment (sin orphan)..."
              kubectl delete deployment cuenly-backend -n ${{ env.NAMESPACE }} --ignore-not-found=true
              kubectl wait --for=delete deployment/cuenly-backend -n ${{ env.NAMESPACE }} --timeout=180s || true
            fi
          fi

          # Limpiar ReplicaSets huérfanos legacy que pueden dejar pods viejos activos
          echo "🧹 Verificando ReplicaSets huérfanos de backend..."
          ORPHAN_RS=$(kubectl get rs -n ${{ env.NAMESPACE }} -l app=cuenly-backend -o go-template='{{range .items}}{{if not .metadata.ownerReferences}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}')
          if [ -n "$ORPHAN_RS" ]; then
            echo "⚠️ ReplicaSets huérfanos detectados:"
            echo "$ORPHAN_RS"
            while IFS= read -r rs; do
              [ -z "$rs" ] && continue
              kubectl delete rs "$rs" -n ${{ env.NAMESPACE }} --ignore-not-found=true
            done <<< "$ORPHAN_RS"
          else
            echo "✅ Sin ReplicaSets huérfanos"
          fi

          # Limpiar pods legacy que no tengan tier=backend
          kubectl delete pods -n ${{ env.NAMESPACE }} -l app=cuenly-backend,!tier --ignore-not-found=true || true

          # redis-deployment.yaml y deployment.yaml (backend/k8s) los aplica Argo.
          # Acá solo actualizamos la imagen: Argo IGNORA ese campo a propósito
          # (ignoreDifferences en la Application cuenly), así que el deploy real
          # de imagen sigue siendo responsabilidad del CI.
          # TODO: quitar este kubectl set image/patch cuando la Application
          # cuenly pase a selfHeal:true y se le saque el ignoreDifferences de
          # containers[0].image — en ese punto el sync de Argo pasa a ser el
          # deploy de imagen (pin en Git + Argo aplica).

          # Actualizar imagen + forzar rollout en un solo patch atómico
          echo "🔄 Actualizando imagen del deployment (patch atómico)..."
          kubectl patch deployment cuenly-backend -n ${{ env.NAMESPACE }} -p \
            "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"cuenly-backend\",\"image\":\"${EXPECTED_BACKEND_IMAGE}\"}]},\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"forceUpdate\":\"$(date +%s)\",\"gitSha\":\"${SHORT_SHA}\"}}}}}"
          
          # Esperar que el rollout complete con rollback automático si falla
          echo "⏳ Esperando rollout del backend..."
          if ! kubectl rollout status deployment/cuenly-backend -n ${{ env.NAMESPACE }} --timeout=300s; then
            echo "❌ Rollout del backend falló. Diagnóstico:"
            kubectl describe deployment cuenly-backend -n ${{ env.NAMESPACE }} || true
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-backend,tier=backend -o wide || true
            kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.metadata.creationTimestamp' | tail -n 30 || true

            for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-backend,tier=backend -o jsonpath='{.items[*].metadata.name}'); do
              echo "=== Logs de $pod ==="
              kubectl logs "$pod" -n ${{ env.NAMESPACE }} --tail=80 || true
            done

            echo "🔄 Haciendo rollback a la versión anterior..."
            kubectl rollout undo deployment/cuenly-backend -n ${{ env.NAMESPACE }} || true
            kubectl rollout status deployment/cuenly-backend -n ${{ env.NAMESPACE }} --timeout=120s || true
            echo "⚠️ Rollback completado. La versión anterior fue restaurada."
            exit 1
          fi

          # Verificar que los pods estén usando la imagen correcta.
          # Retry: el pod viejo puede seguir "Running" hasta ~15s (preStop)
          # mientras termina, apareciendo como mismatch transitorio aunque
          # el rollout ya haya completado con éxito.
          echo "🔍 Verificando imagen desplegada:"
          MISMATCHED_BACKEND=""
          for attempt in $(seq 1 6); do
            BACKEND_IMAGES_BY_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-backend,tier=backend --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.spec.containers[?(@.name=="cuenly-backend")].image}{"\n"}{end}')
            echo "$BACKEND_IMAGES_BY_POD"

            if [ -z "$BACKEND_IMAGES_BY_POD" ]; then
              echo "❌ Error: No se encontraron pods backend para validar imagen"
              exit 1
            fi

            MISMATCHED_BACKEND=$(echo "$BACKEND_IMAGES_BY_POD" | awk -F= -v expected="$EXPECTED_BACKEND_IMAGE" 'NF==2 && $2!=expected {print}')
            if [ -z "$MISMATCHED_BACKEND" ]; then
              break
            fi
            echo "⏳ Intento $attempt/6: pods con imagen vieja (probablemente terminando), reintentando en 10s..."
            sleep 10
          done

          if [ -n "$MISMATCHED_BACKEND" ]; then
            echo "❌ Error: Algunos pods backend no tienen la imagen esperada"
            echo "Imagen esperada: $EXPECTED_BACKEND_IMAGE"
            echo "Pods con imagen incorrecta:"
            echo "$MISMATCHED_BACKEND"
            exit 1
          fi

          echo "✅ Backend desplegado correctamente con SHA: ${SHORT_SHA}"

      - name: Clean orphan worker resources
        run: |
          set -euo pipefail
          echo "🧹 Limpiando recursos huérfanos del worker..."
          
          # Limpiar ReplicaSets huérfanos (sin owner references)
          ORPHAN_RS=$(kubectl get rs -n ${{ env.NAMESPACE }} -l app=cuenly-worker -o go-template='{{range .items}}{{if not .metadata.ownerReferences}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}' 2>/dev/null || echo "")
          if [ -n "$ORPHAN_RS" ]; then
            echo "⚠️  ReplicaSets huérfanos detectados:"
            echo "$ORPHAN_RS"
            while IFS= read -r rs; do
              [ -z "$rs" ] && continue
              echo "🗑️  Eliminando RS huérfano: $rs"
              kubectl delete rs "$rs" -n ${{ env.NAMESPACE }} --ignore-not-found=true
            done <<< "$ORPHAN_RS"
          else
            echo "✅ Sin ReplicaSets huérfanos"
          fi
          
          # Escalar a 0 ReplicaSets con 0 pods ready que estén bloqueando
          for rs in $(kubectl get rs -n ${{ env.NAMESPACE }} -l app=cuenly-worker -o jsonpath='{.items[*].metadata.name}'); do
            DESIRED=$(kubectl get rs "$rs" -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.replicas}')
            READY=$(kubectl get rs "$rs" -n ${{ env.NAMESPACE }} -o jsonpath='{.status.readyReplicas}')
            if [ "$DESIRED" != "0" ] && [ "${READY:-0}" = "0" ]; then
              echo "⚠️  RS $rs tiene desired=$DESIRED pero ready=0, escalando a 0..."
              kubectl scale rs "$rs" -n ${{ env.NAMESPACE }} --replicas=0 || true
            fi
          done
          
          echo "✅ Limpieza de recursos worker completada"

      - name: Deploy Worker Service
        run: |
          set -euo pipefail
          echo "🚀 Desplegando Worker Service..."
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          EXPECTED_WORKER_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-backend:sha-${SHORT_SHA}
          
          # Verificar que la imagen worker (backend) existe antes de desplegar.
          # Retry: mismo flake de propagación de GHCR que en el backend.
          IMAGE_FOUND=false
          for attempt in $(seq 1 5); do
            if docker manifest inspect "${EXPECTED_WORKER_IMAGE}" > /dev/null 2>&1; then
              IMAGE_FOUND=true
              break
            fi
            echo "⏳ Intento $attempt/5: imagen no encontrada todavía en GHCR, reintentando en 15s..."
            sleep 15
          done
          if [ "$IMAGE_FOUND" != "true" ]; then
            echo "❌ Error: imagen worker no encontrada en GHCR tras 5 intentos: ${EXPECTED_WORKER_IMAGE}"
            exit 1
          fi
          
          # worker-deployment.yaml, worker-pdb.yaml y worker-scaledobject.yaml
          # (backend/k8s) los aplica Argo. Acá solo actualizamos la imagen (ver
          # nota de ignoreDifferences en el paso de deploy del backend).
          # TODO: mismo bridge temporal que el backend — quitar cuando la
          # Application cuenly pase a selfHeal:true (ver TODO en "Deploy
          # backend application").

          # Actualizar imagen + forzar rollout en un solo patch atómico
          echo "🔄 Actualizando imagen del worker deployment (patch atómico)..."
          kubectl patch deployment cuenly-worker -n ${{ env.NAMESPACE }} -p \
            "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"cuenly-worker\",\"image\":\"${EXPECTED_WORKER_IMAGE}\"}]},\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"forceUpdate\":\"$(date +%s)\",\"gitSha\":\"${SHORT_SHA}\"}}}}}"
          
          # Esperar que el rollout complete con diagnóstico automático si falla
          echo "⏳ Esperando rollout del worker..."
          if ! kubectl rollout status deployment/cuenly-worker -n ${{ env.NAMESPACE }} --timeout=300s; then
            echo "❌ Rollout del worker falló o expiró. Diagnóstico:"
            kubectl describe deployment cuenly-worker -n ${{ env.NAMESPACE }} || true
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-worker -o wide || true
            kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.metadata.creationTimestamp' | tail -n 30 || true

            for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-worker -o jsonpath='{.items[*].metadata.name}'); do
              echo "=== Logs de $pod ==="
              kubectl logs "$pod" -n ${{ env.NAMESPACE }} --tail=80 || true
            done

            echo "🔄 Haciendo rollback del worker a la versión anterior..."
            kubectl rollout undo deployment/cuenly-worker -n ${{ env.NAMESPACE }} || true
            kubectl rollout status deployment/cuenly-worker -n ${{ env.NAMESPACE }} --timeout=120s || true
            echo "⚠️ Rollback completado. La versión anterior fue restaurada."
            exit 1
          fi
          
          # Limpiar pods con imagen incorrecta después del rollout
          echo "🧹 Limpiando pods worker con imagen incorrecta..."
          for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-worker,tier=worker --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}'); do
            POD_IMAGE=$(kubectl get pod "$pod" -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.containers[?(@.name=="cuenly-worker")].image}')
            if [ "$POD_IMAGE" != "$EXPECTED_WORKER_IMAGE" ]; then
              echo "🗑️  Eliminando pod con imagen incorrecta: $pod (tiene: $POD_IMAGE)"
              kubectl delete pod "$pod" -n ${{ env.NAMESPACE }} --force --grace-period=0 || true
            fi
          done
          
          # Escalar a 0 ReplicaSets antiguos del worker
          echo "🧹 Escalando a 0 ReplicaSets antiguos..."
          CURRENT_RS=$(kubectl get deployment cuenly-worker -n ${{ env.NAMESPACE }} -o jsonpath='{.status.conditions[?(@.type=="Progressing")].message}' | grep -oP 'ReplicaSet "[^"]*' | grep -oP '"[^"]*"' | tr -d '"' || echo "")
          for rs in $(kubectl get rs -n ${{ env.NAMESPACE }} -l app=cuenly-worker -o jsonpath='{.items[*].metadata.name}'); do
            RS_REPLICAS=$(kubectl get rs "$rs" -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.replicas}')
            if [ "$RS_REPLICAS" != "0" ] && [ "$rs" != "$CURRENT_RS" ]; then
              RS_IMAGE=$(kubectl get rs "$rs" -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}')
              if [ "$RS_IMAGE" != "$EXPECTED_WORKER_IMAGE" ]; then
                echo "🗑️  Escalando RS antiguo a 0: $rs (imagen: $RS_IMAGE)"
                kubectl scale rs "$rs" -n ${{ env.NAMESPACE }} --replicas=0 || true
              fi
            fi
          done
          
          # Esperar que los pods viejos terminen completamente
          echo "⏳ Esperando terminación de pods viejos..."
          sleep 15
          kubectl wait --for=delete pod -n ${{ env.NAMESPACE }} -l app=cuenly-worker --field-selector=status.phase!=Running --timeout=60s 2>/dev/null || true
          sleep 15
          
          # Verificar imagen del worker en todos los pods (solo tier=worker).
          # Retry: mismo race de preStop que en el backend, por si el sleep 15
          # de arriba no alcanzó a cubrir la terminación completa.
          echo "🔍 Verificando imagen del worker en todos los pods..."
          MISMATCHED_WORKER=""
          for attempt in $(seq 1 6); do
            WORKER_IMAGES_BY_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-worker,tier=worker --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.spec.containers[?(@.name=="cuenly-worker")].image}{"\n"}{end}')
            echo "$WORKER_IMAGES_BY_POD"

            if [ -z "$WORKER_IMAGES_BY_POD" ]; then
              echo "❌ No se encontraron pods worker para validar"
              exit 1
            fi

            MISMATCHED_WORKER=$(echo "$WORKER_IMAGES_BY_POD" | awk -F= -v expected="$EXPECTED_WORKER_IMAGE" 'NF==2 && $2!=expected {print}')
            if [ -z "$MISMATCHED_WORKER" ]; then
              break
            fi
            echo "⏳ Intento $attempt/6: pods con imagen vieja (probablemente terminando), reintentando en 10s..."
            sleep 10
          done

          if [ -n "$MISMATCHED_WORKER" ]; then
            echo "❌ Algunos pods worker no tienen la imagen esperada"
            echo "Imagen esperada: $EXPECTED_WORKER_IMAGE"
            echo "Pods con imagen incorrecta:"
            echo "$MISMATCHED_WORKER"
            exit 1
          fi

          echo "✅ Worker desplegado correctamente con imagen: $EXPECTED_WORKER_IMAGE"

      - name: Pin deployed image tag in Git manifests
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-backend:sha-${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry con fetch+reset: si el remoto avanzó desde el checkout (otro
          # run/push en el medio), el primer push queda rechazado
          # (non-fast-forward). Cada intento parte de origin/HEAD fresco y
          # reaplica el sed, así que no hay merge/rebase que pueda conflictuar.
          for attempt in $(seq 1 5); do
            sed -i -E "s#image: ghcr\.io/poravv/cuenly-app-backend:[A-Za-z0-9_.-]+#image: ${NEW_IMAGE}#" \
              backend/k8s/deployment.yaml backend/k8s/worker-deployment.yaml

            if git diff --quiet -- backend/k8s/deployment.yaml backend/k8s/worker-deployment.yaml; then
              echo "ℹ️ Git ya tenía el tag ${SHORT_SHA}, nada que commitear"
              exit 0
            fi

            git add backend/k8s/deployment.yaml backend/k8s/worker-deployment.yaml
            git commit -m "chore(k8s): pin backend/worker image to sha-${SHORT_SHA} [skip ci]"

            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ Tag pinneado en Git"
              exit 0
            fi

            echo "⏳ Intento $attempt/5: push rechazado (el remoto avanzó), sincronizando y reintentando..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
          done

          echo "❌ No se pudo pushear el pin de imagen tras 5 intentos"
          exit 1

      - name: Remove old backend ingress (now handled by frontend)
        run: |
          kubectl delete ingress cuenly-backend-ingress -n ${{ env.NAMESPACE }} --ignore-not-found=true
          echo "✅ Backend ingress eliminado - ahora se maneja desde frontend ingress"
          
      - name: Backend health check
        id: health-check
        run: |
          set -euo pipefail
          echo "⏳ Esperando servicio backend..."
          sleep 30
          
          # Verificar que el servicio existe
          kubectl get svc cuenly-backend-service -n ${{ env.NAMESPACE }}
          
          # Esperar a que los pods estén listos usando kubectl wait
          echo "🔍 Esperando pods backend ready..."
          kubectl wait --for=condition=ready pod -l app=cuenly-backend,tier=backend -n ${{ env.NAMESPACE }} --timeout=300s
          
          # Health check usando kubectl exec desde dentro del cluster
          BACKEND_POD=$(kubectl get pods -l app=cuenly-backend,tier=backend -n ${{ env.NAMESPACE }} --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          
          if [ -z "$BACKEND_POD" ]; then
            echo "❌ No se encontró pod backend corriendo"
            kubectl get pods -l app=cuenly-backend,tier=backend -n ${{ env.NAMESPACE }}
            exit 1
          fi
          
          echo "🔍 Realizando health check en pod: $BACKEND_POD"
          
          # Verificar si curl está disponible en el pod
          echo "🔍 Verificando herramientas disponibles en el pod..."
          kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- which curl > /dev/null 2>&1 || echo "⚠️  curl no disponible, intentando con wget"
          
          # Health check con múltiples métodos
          for i in $(seq 1 5); do
            echo "🔄 Health check attempt $i/5..."
            
            # Método 1: Intentar con curl si está disponible
            if kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- which curl > /dev/null 2>&1; then
              if kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Backend healthy via curl"
                echo "ready=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            
            # Método 2: Intentar con wget si curl no funciona
            if kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- which wget > /dev/null 2>&1; then
              if kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- wget -q --spider http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Backend healthy via wget"
                echo "ready=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            
            # Método 3: Verificar si el puerto está abierto
            if kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- netstat -tln 2>/dev/null | grep ":8000" > /dev/null; then
              echo "✅ Puerto 8000 está abierto, asumiendo backend healthy"
              echo "ready=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Método 4: Si nada funciona, verificar procesos Python
            if kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- ps aux | grep -v grep | grep python > /dev/null 2>&1; then
              echo "✅ Proceso Python corriendo, asumiendo backend healthy"
              echo "ready=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            echo "❌ Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Backend health check failed after all attempts"
          echo "📋 Diagnóstico detallado:"
          
          echo "=== Pod status ==="
          kubectl get pod $BACKEND_POD -n ${{ env.NAMESPACE }} -o wide
          
          echo "=== Pod logs (últimas 50 líneas) ==="
          kubectl logs $BACKEND_POD -n ${{ env.NAMESPACE }} --tail=50
          
          echo "=== Procesos en el pod ==="
          kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- ps aux || echo "ps no disponible"
          
          echo "=== Puertos abiertos ==="
          kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- netstat -tln || echo "netstat no disponible"
          
          echo "=== Variables de entorno ==="
          kubectl exec $BACKEND_POD -n ${{ env.NAMESPACE }} -- env | grep -E "(API_|PORT|HOST)" || echo "No env vars found"
          
          # Si todo falló pero el pod está Ready, asumir que está funcionando
          POD_READY=$(kubectl get pod $BACKEND_POD -n ${{ env.NAMESPACE }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
          if [ "$POD_READY" = "True" ]; then
            echo "⚠️  Health check manual falló, pero Kubernetes marca el pod como Ready"
            echo "✅ Continuando con deploy basado en Kubernetes readiness probe"
            echo "ready=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          exit 1

  debug-conditions:
    needs: [detect-changes, build-frontend, deploy-backend]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Debug all conditions
        run: |
          echo "🔍 DEBUGGING DEPLOY CONDITIONS"
          echo "=============================="
          echo "🌿 Branch info:"
          echo "  github.ref: ${{ github.ref }}"
          echo "  Is main/master: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}"
          echo ""
          echo "📦 Build results:"
          echo "  build-frontend.result: ${{ needs.build-frontend.result }}"
          echo "  deploy-backend.result: ${{ needs.deploy-backend.result }}"
          echo "  backend-ready: '${{ needs.deploy-backend.outputs.backend-ready }}'"
          echo ""
          echo "🔄 Changes detected:"
          echo "  frontend-changed: '${{ needs.detect-changes.outputs.frontend-changed }}'"
          echo "  config-changed: '${{ needs.detect-changes.outputs.config-changed }}'"
          echo ""
          echo "🎯 SHOULD DEPLOY:"
          echo "  Backend: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (needs.detect-changes.outputs.backend-changed == 'true' || needs.detect-changes.outputs.config-changed == 'true') && needs.build-backend.result == 'success' }}"
          echo "  Frontend: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') && ((needs.detect-changes.outputs.frontend-changed == 'true' || needs.detect-changes.outputs.config-changed == 'true') || (needs.deploy-backend.result == 'success' && needs.deploy-backend.outputs.backend-ready == 'true')) }}"

  # SCOPE: ninguna Argo Application trackea frontend/k8s hoy (la Application
  # "cuenly" en k8s-platforms/argocd/apps/cuenly.yaml solo trackea
  # backend/k8s, namespace cuenly-backend). Este job queda 100%
  # CI-managed a propósito — no se tocaron sus kubectl apply/set-image/rollout
  # como parte de la migración anti-drift (paso 2), porque no hay Argo
  # gestionando ese path para que el CI le ceda el apply. Tampoco se tocó
  # k8s-security-improvements/ (fuera de backend/k8s y frontend/k8s, sin
  # Application propia). Si algún día se crea una Application para el
  # frontend, este job necesita el mismo tratamiento que deploy-backend.
  deploy-frontend:
    needs: [detect-changes, build-frontend, deploy-backend]
    # Frontend se despliega si cambió O si backend cambió (para mantener sincronización) Y estamos en rama principal
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') && ((needs.detect-changes.outputs.frontend-changed == 'true' || needs.detect-changes.outputs.config-changed == 'true') || (needs.deploy-backend.result == 'success' && needs.deploy-backend.outputs.backend-ready == 'true'))
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment || 'development' }}
    env:
      NAMESPACE: cuenly-frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build frontend image if needed
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
      
      - name: Ensure namespace exists
        run: |
          kubectl apply -f frontend/k8s/namespace.yaml
          
      - name: Deploy frontend infrastructure
        run: |
          # Aplicar backend proxy service primero
          kubectl apply -f frontend/k8s/backend-proxy-service.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f frontend/k8s/configmap.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f frontend/k8s/networkpolicy.yaml -n ${{ env.NAMESPACE }}
          
          # Aplicar ingress seguro con rate limiting con fallbacks
          echo "🛡️  Configurando ingress con seguridad..."
          
          # Intentar ingress seguro sin snippets (más compatible)
          if [ -f "k8s-security-improvements/ingress-secure-nosnippets.yaml" ]; then
            echo "🔐 Intentando ingress seguro sin snippets..."
            if kubectl apply -f k8s-security-improvements/ingress-secure-nosnippets.yaml -n ${{ env.NAMESPACE }}; then
              echo "✅ Ingress seguro aplicado correctamente"
            else
              echo "⚠️  Ingress seguro falló, intentando con ingress normal..."
              kubectl apply -f frontend/k8s/ingress.yaml -n ${{ env.NAMESPACE }}
            fi
          # Fallback: intentar ingress seguro con snippets
          elif [ -f "k8s-security-improvements/ingress-secure.yaml" ]; then
            echo "🔐 Intentando ingress seguro con snippets..."
            if kubectl apply -f k8s-security-improvements/ingress-secure.yaml -n ${{ env.NAMESPACE }}; then
              echo "✅ Ingress seguro aplicado correctamente"
            else
              echo "⚠️  Ingress seguro falló (snippets deshabilitados), usando ingress normal..."
              kubectl apply -f frontend/k8s/ingress.yaml -n ${{ env.NAMESPACE }}
            fi
          # Fallback final: ingress normal
          else
            echo "⚠️  Ingress seguro no encontrado, usando ingress normal"
            kubectl apply -f frontend/k8s/ingress.yaml -n ${{ env.NAMESPACE }}
          fi
          
          echo "✅ Infraestructura frontend con seguridad configurada"
          
      - name: Pre-deploy diagnostics
        run: |
          echo "🔍 Diagnóstico pre-deploy..."
          
          # Verificar recursos del cluster
          echo "📊 Recursos disponibles:"
          kubectl top nodes || echo "Metrics server no disponible"
          
          # Verificar estado actual del namespace
          echo "📋 Estado actual del namespace frontend:"
          kubectl get all -n ${{ env.NAMESPACE }} || echo "Namespace vacío"
          
          # Verificar imágenes disponibles
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "🔍 Verificando imagen sha-${SHORT_SHA}..."
          
          # Verificar backend usando kubectl desde dentro del cluster
          echo "🔍 Verificando disponibilidad del backend..."
          kubectl get svc cuenly-backend-service -n cuenly-backend
          
          # Verificar que hay pods backend corriendo
          BACKEND_PODS=$(kubectl get pods -l app=cuenly-backend,tier=backend -n cuenly-backend --field-selector=status.phase=Running -o name | wc -l)
          if [ "$BACKEND_PODS" -eq 0 ]; then
            echo "❌ No hay pods backend corriendo"
            exit 1
          fi
          
          echo "✅ $BACKEND_PODS pods backend están corriendo"
          
          # Verificar que el backend está funcionando usando readiness probe de Kubernetes
          BACKEND_POD=$(kubectl get pods -l app=cuenly-backend,tier=backend -n cuenly-backend --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$BACKEND_POD" ]; then
            echo "🔍 Verificando estado del pod backend: $BACKEND_POD"
            POD_READY=$(kubectl get pod $BACKEND_POD -n cuenly-backend -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
            if [ "$POD_READY" = "True" ]; then
              echo "✅ Backend pod está Ready según Kubernetes"
            else
              echo "❌ Backend pod no está Ready"
              kubectl describe pod $BACKEND_POD -n cuenly-backend
              exit 1
            fi
          else
            echo "❌ No se encontró pod backend corriendo"
            kubectl get pods -l app=cuenly-backend,tier=backend -n cuenly-backend
            exit 1
          fi
          
      - name: Clean orphan frontend resources
        run: |
          set -euo pipefail
          echo "🧹 Limpiando recursos huérfanos del frontend..."
          
          # Limpiar ReplicaSets huérfanos (sin owner references)
          ORPHAN_RS=$(kubectl get rs -n ${{ env.NAMESPACE }} -l app=cuenly-frontend -o go-template='{{range .items}}{{if not .metadata.ownerReferences}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}' 2>/dev/null || echo "")
          if [ -n "$ORPHAN_RS" ]; then
            echo "⚠️  ReplicaSets huérfanos detectados:"
            echo "$ORPHAN_RS"
            while IFS= read -r rs; do
              [ -z "$rs" ] && continue
              echo "🗑️  Eliminando RS huérfano: $rs"
              kubectl delete rs "$rs" -n ${{ env.NAMESPACE }} --ignore-not-found=true
            done <<< "$ORPHAN_RS"
          else
            echo "✅ Sin ReplicaSets huérfanos"
          fi
          
          # Limpiar pods legacy que no tienen tier=frontend
          kubectl delete pods -n ${{ env.NAMESPACE }} -l app=cuenly-frontend,!tier --ignore-not-found=true 2>/dev/null || true
          
          # Escalar a 0 ReplicaSets antiguos no controlados por el deployment actual
          for rs in $(kubectl get rs -n ${{ env.NAMESPACE }} -l app=cuenly-frontend -o jsonpath='{.items[*].metadata.name}'); do
            DESIRED=$(kubectl get rs "$rs" -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.replicas}')
            READY=$(kubectl get rs "$rs" -n ${{ env.NAMESPACE }} -o jsonpath='{.status.readyReplicas}')
            if [ "$DESIRED" != "0" ] && [ "${READY:-0}" = "0" ]; then
              echo "⚠️  RS $rs tiene desired=$DESIRED pero ready=0, escalando a 0..."
              kubectl scale rs "$rs" -n ${{ env.NAMESPACE }} --replicas=0 || true
            fi
          done
          
          echo "✅ Limpieza de recursos completada"
          
      - name: Deploy frontend application
        run: |
          set -euo pipefail
          echo "🚀 Desplegando frontend..."
          
          # Obtener SHA corto para tag único
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "📦 Desplegando imagen: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-frontend:sha-${SHORT_SHA}"
          
          # Verificar que la imagen existe antes del deploy
          echo "🔍 Verificando que la imagen existe..."
          if ! docker manifest inspect ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-frontend:sha-${SHORT_SHA} > /dev/null 2>&1; then
            echo "❌ Error: La imagen no existe en el registry"
            echo "Intentando usar la imagen latest como fallback..."
            IMAGE_TAG="latest"
          else
            echo "✅ Imagen encontrada en registry"
            IMAGE_TAG="sha-${SHORT_SHA}"
          fi
          EXPECTED_FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-frontend:${IMAGE_TAG}
          
          # Aplicar configuración de Kubernetes
          kubectl apply -f frontend/k8s/deployment.yaml -n ${{ env.NAMESPACE }}
          
          # Actualizar imagen + forzar rollout en un solo patch atómico
          echo "🔄 Actualizando imagen del frontend deployment (patch atómico)..."
          kubectl patch deployment cuenly-frontend -n ${{ env.NAMESPACE }} -p \
            "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"cuenly-frontend\",\"image\":\"${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-frontend:${IMAGE_TAG}\"}]},\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"forceUpdate\":\"$(date +%s)\",\"gitSha\":\"${SHORT_SHA}\",\"imageTag\":\"${IMAGE_TAG}\"}}}}}"
          
          # Esperar que el rollout complete con timeout más largo
          echo "⏳ Esperando rollout (puede tomar varios minutos)..."
          if ! kubectl rollout status deployment/cuenly-frontend -n ${{ env.NAMESPACE }} --timeout=900s; then
            echo "❌ Rollout timeout, diagnosticando problemas..."
            
            echo "📋 Estado del deployment:"
            kubectl describe deployment cuenly-frontend -n ${{ env.NAMESPACE }}
            
            echo "📋 Estado de los pods:"
            kubectl get pods -l app=cuenly-frontend -n ${{ env.NAMESPACE }} -o wide
            
            echo "📋 Eventos recientes:"
            kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
            
            echo "📋 Logs de pods con problemas:"
            for pod in $(kubectl get pods -l app=cuenly-frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
              echo "=== Logs del pod: $pod ==="
              kubectl logs $pod -n ${{ env.NAMESPACE }} --tail=50 || echo "No logs available"
            done
            
            exit 1
          fi
          
          # Limpiar pods con imagen incorrecta después del rollout
          echo "🧹 Limpiando pods frontend con imagen incorrecta..."
          for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-frontend,tier=frontend --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}'); do
            POD_IMAGE=$(kubectl get pod "$pod" -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.containers[?(@.name=="cuenly-frontend")].image}')
            if [ "$POD_IMAGE" != "$EXPECTED_FRONTEND_IMAGE" ]; then
              echo "🗑️  Eliminando pod con imagen incorrecta: $pod (tiene: $POD_IMAGE)"
              kubectl delete pod "$pod" -n ${{ env.NAMESPACE }} --force --grace-period=0 || true
            fi
          done
          
          # Escalar a 0 ReplicaSets antiguos del frontend
          echo "🧹 Escalando a 0 ReplicaSets antiguos..."
          for rs in $(kubectl get rs -n ${{ env.NAMESPACE }} -l app=cuenly-frontend -o jsonpath='{.items[*].metadata.name}'); do
            RS_REPLICAS=$(kubectl get rs "$rs" -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.replicas}')
            if [ "$RS_REPLICAS" != "0" ]; then
              RS_IMAGE=$(kubectl get rs "$rs" -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}')
              if [ "$RS_IMAGE" != "$EXPECTED_FRONTEND_IMAGE" ]; then
                echo "🗑️  Escalando RS antiguo a 0: $rs (imagen: $RS_IMAGE)"
                kubectl scale rs "$rs" -n ${{ env.NAMESPACE }} --replicas=0 || true
              fi
            fi
          done
          
          # Esperar que los pods viejos terminen completamente
          echo "⏳ Esperando terminación de pods viejos..."
          sleep 15
          kubectl wait --for=delete pod -n ${{ env.NAMESPACE }} -l app=cuenly-frontend --field-selector=status.phase!=Running --timeout=60s 2>/dev/null || true
          sleep 15
          
          # Verificar que los pods estén usando la imagen correcta (solo tier=frontend).
          # Retry: mismo race de preStop que en backend/worker.
          echo "🔍 Verificando imagen desplegada:"
          MISMATCHED_FRONTEND=""
          for attempt in $(seq 1 6); do
            FRONTEND_IMAGES_BY_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=cuenly-frontend,tier=frontend --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.spec.containers[?(@.name=="cuenly-frontend")].image}{"\n"}{end}')
            echo "$FRONTEND_IMAGES_BY_POD"

            if [ -z "$FRONTEND_IMAGES_BY_POD" ]; then
              echo "❌ No se encontraron pods frontend para validar imagen"
              exit 1
            fi

            MISMATCHED_FRONTEND=$(echo "$FRONTEND_IMAGES_BY_POD" | awk -F= -v expected="$EXPECTED_FRONTEND_IMAGE" 'NF==2 && $2!=expected {print}')
            if [ -z "$MISMATCHED_FRONTEND" ]; then
              break
            fi
            echo "⏳ Intento $attempt/6: pods con imagen vieja (probablemente terminando), reintentando en 10s..."
            sleep 10
          done

          if [ -n "$MISMATCHED_FRONTEND" ]; then
            echo "❌ Error: Algunos pods frontend no están usando la imagen esperada"
            echo "Imagen esperada: $EXPECTED_FRONTEND_IMAGE"
            echo "Pods con imagen incorrecta:"
            echo "$MISMATCHED_FRONTEND"
            exit 1
          fi

          echo "✅ Frontend desplegado correctamente con imagen: ${IMAGE_TAG}"
          
      - name: Frontend health check
        run: |
          echo "🏥 Iniciando health check del frontend..."
          sleep 30
          
          # Verificar que los pods están corriendo
          echo "📋 Estado de los pods:"
          kubectl get pods -l app=cuenly-frontend -n ${{ env.NAMESPACE }} -o wide
          
          # Verificar que el servicio frontend existe
          if kubectl get service cuenly-frontend-service -n ${{ env.NAMESPACE }} > /dev/null 2>&1; then
            FRONTEND_IP=$(kubectl get service cuenly-frontend-service -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.clusterIP}')
            echo "🔍 IP del servicio frontend: $FRONTEND_IP"
            
            # Health check con más intentos
            for i in {1..15}; do
              echo "🔄 Intento $i/15..."
              if curl -f -m 10 http://$FRONTEND_IP/ > /dev/null 2>&1; then
                echo "✅ Frontend health check passed"
                break
              elif curl -f -m 10 http://$FRONTEND_IP/health > /dev/null 2>&1; then
                echo "✅ Frontend health endpoint responded"
                break
              fi
              
              if [ $i -eq 15 ]; then
                echo "❌ Frontend health check failed after 15 attempts"
                
                echo "📋 Diagnóstico final:"
                kubectl describe service cuenly-frontend-service -n ${{ env.NAMESPACE }}
                kubectl get endpoints -n ${{ env.NAMESPACE }}
                
                echo "📋 Logs de pods:"
                for pod in $(kubectl get pods -l app=cuenly-frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
                  echo "=== Logs del pod: $pod ==="
                  kubectl logs $pod -n ${{ env.NAMESPACE }} --tail=50 || echo "No logs available"
                done
                
                # No fallar el deploy si los pods están corriendo
                RUNNING_PODS=$(kubectl get pods -l app=cuenly-frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | wc -w)
                if [ "$RUNNING_PODS" -gt 0 ]; then
                  echo "⚠️  Health check falló pero hay $RUNNING_PODS pods corriendo, continuando..."
                else
                  exit 1
                fi
              else
                echo "Intento $i fallido, reintentando en 15 segundos..."
                sleep 15
              fi
            done
          else
            echo "⚠️  Frontend service not found, verificando pods directamente..."
            RUNNING_PODS=$(kubectl get pods -l app=cuenly-frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | wc -w)
            if [ "$RUNNING_PODS" -gt 0 ]; then
              echo "✅ $RUNNING_PODS pods frontend están corriendo"
            else
              echo "❌ No hay pods frontend corriendo"
              exit 1
            fi
          fi

  deployment-summary:
    needs: [detect-changes, build-backend, build-frontend, deploy-backend, deploy-frontend]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Summary
        run: |
          echo "🎯 Deployment Summary"
          echo "=================="
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📦 Changes:"
          echo "  Backend changed: ${{ needs.detect-changes.outputs.backend-changed }}"
          echo "  Frontend changed: ${{ needs.detect-changes.outputs.frontend-changed }}"
          echo "  Config changed: ${{ needs.detect-changes.outputs.config-changed }}"
          echo ""
          echo "🏗️  Build results:"
          echo "  Backend build: ${{ needs.build-backend.result || 'skipped' }}"
          echo "  Frontend build: ${{ needs.build-frontend.result || 'skipped' }}"
          echo ""
          echo "🚀 Deploy results:"
          echo "  Backend deployment: ${{ needs.deploy-backend.result || 'skipped' }}"
          echo "  Frontend deployment: ${{ needs.deploy-frontend.result || 'skipped' }}"
          echo "  Backend ready: ${{ needs.deploy-backend.outputs.backend-ready || 'false' }}"
          echo ""
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "📋 Cluster Status:"
            kubectl get pods -n cuenly-backend -o wide || echo "No backend pods"
            kubectl get pods -n cuenly-frontend -o wide || echo "No frontend pods"
            echo ""
            echo "🌐 Services:"
            kubectl get svc -n cuenly-backend || echo "No backend services"
            kubectl get svc -n cuenly-frontend || echo "No frontend services"
            
            echo "🛡️  Security Status:"
            kubectl get configmap nginx-rate-limit-config -n cuenly-frontend > /dev/null 2>&1 && echo "  ✅ Rate limiting: Configured" || echo "  ⚠️  Rate limiting: Not configured"
            kubectl get networkpolicy -n cuenly-backend -n cuenly-frontend > /dev/null 2>&1 && echo "  ✅ Network policies: Active" || echo "  ⚠️  Network policies: Not found"
            kubectl get secret backend-env-secrets -n cuenly-backend -o jsonpath='{.data.FRONTEND_API_KEY}' > /dev/null 2>&1 && echo "  ✅ Frontend API Key: Configured" || echo "  ⚠️  Frontend API Key: Missing"
          else
            echo "ℹ️  Deploy skipped - not on main/master branch"
          fi
