apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cuenly-ingress
  namespace: cuenly-frontend
  annotations:
    # Sin TLS en el cluster: app.cuenly.com apunta al proxy openresty externo, que termina TLS
    # con su propio cert Let's Encrypt. cert-manager no puede emitir para cuenly.com (el
    # ClusterIssuer solo tiene DNS-01 para la zona mindtechpy.net) y dejaba la Order colgada.
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    # CORS es manejado directamente por el backend para mayor seguridad y control
spec:
  ingressClassName: nginx
  rules:
    - host: app.cuenly.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cuenly-frontend-service
                port:
                  number: 80
